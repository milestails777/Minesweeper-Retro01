<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrosweeper</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P"/>
    <link rel="stylesheet" href="stylesweeper.css"/>
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
</head>
<body>
<div class="window">
    <div class="title-bar">
        <div class="title-bar-text">Minesweeper</div>
    </div>
    <div class="window-body">
        <div class="game-container"> 
            <nav class="nav">
                <div id="mines-left">012</div>
                <button id="smiley"></button>
                <div id="timer">000</div>
            </nav>
            <div id="grid"></div>
        </div>
    </div>
</div>
<div class="music-button">
    <button id="mute-button" class="unmuted" style="display: none;">
        <div class="mute-icon"></div>
        <span class="mute-text">ON</span>
    </button>
</div>
<div class="audio">
    <audio id="click" src="audio/click.mp3" preload="auto"></audio>
    <audio id="click2" src="audio/click2.mp3" preload="auto"></audio>
    <audio id="flag" src="audio/flag.mp3" preload="auto"></audio>
    <audio id="boom" src="audio/boom.mp3" preload="auto"></audio>
    <audio id="gong" src="audio/gong.mp3" preload="auto"></audio>
    <audio id="main-music" src="audio/main-music.mp3" loop preload="auto"></audio>
    <audio id="win-music" src="audio/win-music.mp3" loop preload="auto"></audio>
</div>
<div id="secretka"></div>
<div class="taskbar">
    <button class="start-button">
        <img src="assets/start-icon.png" class="start-icon" alt="Start">
        <span class="start-text">Start</span>
    </button>
    <img src="assets/taskbar-element.png" class="taskbar-element" alt="Taskbar element 1">
    <div class="taskbar-tray">
        <img src="assets/taskbar-element2.png" class="taskbar-element2" alt="Taskbar element 2">
        <div id="timer-display">00:00</div>
    </div>
</div>
<div id="game-result-bg"></div>
<img src="assets/icons.png" class="icons" alt="Icons">
<script src="scriptsweeper.js"></script>
</body>
</html>
